updates:
  - commit-message:
      prefix: ci
    package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 1
  - commit-message:
      include: scope
      prefix: chore
    package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 1
  - commit-message:
      prefix: chore
    package-ecosystem: nix
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 1
version: 2
